<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>クマせんせいの つりきょうしつ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2.1.0">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="home-btn" class="icon-btn" aria-label="はじめに もどる">🏠</button>
      <ol id="progress" class="progress" aria-label="すすみぐあい"></ol>
      <button id="sound-btn" class="icon-btn" aria-label="おとと こえを けす">🔊</button>
    </header>

    <section id="guide" class="guide" aria-live="polite">
      <div id="bear" class="bear-box"></div>
      <div class="bubble">
        <p id="guide-text"></p>
        <span class="replay" aria-hidden="true">🔁 もういちど きく</span>
      </div>
    </section>

    <main id="stage" class="stage"></main>

    <nav id="controls" class="controls"></nav>
  </div>

  <script src="js/version.js?v=2.1.0"></script>
  <script src="js/audio.js?v=2.1.0"></script>
  <script src="js/data.js?v=2.1.0"></script>
  <script src="js/art.js?v=2.1.0"></script>
  <script src="js/main.js?v=2.1.0"></script>
  <script src="js/scenes.js?v=2.1.0"></script>
  <script src="js/prep.js?v=2.1.0"></script>
  <script src="js/fishing.js?v=2.1.0"></script>
  <script>App.init();</script>
</body>
</html>
